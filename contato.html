<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="icon" type="image/svg" href="./assets/img/user-profile-svgrepo-com.svg">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Meu Perfil</title>
</head>
<body>
    <header>
        <div id="header_content" class="flex">
            <div id="titulo">
                <h1>
                    Caroline Ribeiro
                </h1>
            </div>
            <div id="menu">
                <nav>
                    <ul id="menu">
                        <li>
                            <a href="index.html"> Home </a>
                        </li>
                        <li>
                            <a href="contato.html"> Contato</a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <main>
        <div id="contact" class="flex">
            <form action="#" method="submit" id="formulario">

                <label for="name">Nome: </label>
                <input id="name" type="text" name="name" placeholder="Digite seu nome">
                <span id="txtNome"></span>

                <label for="email">E-mail: </label>
                <input id="email" type="text" name="email" placeholder="Digite seu email">
                <span id="txtNome"></span>

                <label for="subject">Assunto: </label>
                <input id="subject" type="text" name="subject" placeholder="Digite o título da menssagem">
                <span id="txtNome"></span>

                <label for="message">Mensagem: </label>
                <textarea name="message" id="message" placeholder="Digite sua menssagem"> </textarea>

                <button type="submit">Enviar</button>

            </form>
            <section id="mapa" class="flex_start">
                <div id="endereco">
                    <p>R. Praia do Castelo</p>
                    <p>São Paulo - SP</p>
                </div>

                <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3654.8184943550846!2d-46.67094952512936!3d-23.646670364731033!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce5a9d214a4e43%3A0x5b3172436ae50c7f!2sR.%20Praia%20do%20Castelo%20-%20Vila%20Mascote%2C%20S%C3%A3o%20Paulo%20-%20SP%2C%2004362-020!5e0!3m2!1spt-BR!2sbr!4v1738609308031!5m2!1spt-BR!2sbr" 
                        width="600" 
                        height="450" 
                        style="border:0;" 
                        allowfullscreen="" 
                        loading="lazy" 
                        referrerpolicy="no-referrer-when-downgrade">
                </iframe>

            </section>
            
        </div>

        
    </main>

    <footer class="flex">
        <section id="redes_sociais">
            <a href="https://www.linkedin.com/in/caroline-ribeiro-aa14442b0/" target="_blank">
                <img src="assets/img/linkedin.svg" alt="LinkedIn" class="social_icon">
            </a>
